<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16161d">
    <title>Kinklist</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="top" class="top">
        <div class="top-row">
            <h1 data-i18n="title"></h1>
            <span id="progress" class="progress"></span>
            <button id="languageToggle" class="btn" type="button"></button>
            <button id="openExport" class="btn primary" type="button" data-i18n="export"></button>
        </div>
        <div id="legend" class="legend"></div>
    </header>

    <nav id="categoryNav" class="category-nav"></nav>

    <main id="list" class="list"></main>

    <footer class="bottom">
        <button id="openEditor" class="btn" type="button" data-i18n="editList"></button>
        <button id="resetRatings" class="btn danger" type="button" data-i18n="resetAnswers"></button>
    </footer>

    <dialog id="exportDialog" class="sheet">
        <form method="dialog" class="sheet-header">
            <h2 data-i18n="export"></h2>
            <button class="btn icon" data-i18n-aria-label="close">✕</button>
        </form>
        <label class="field-row">
            <span data-i18n="nameLabel"></span>
            <input id="nameInput" class="input" type="text" maxlength="40" data-i18n-placeholder="namePlaceholder">
        </label>
        <label class="check-row">
            <input id="onlyRated" type="checkbox" checked>
            <span data-i18n="onlyRated"></span>
        </label>
        <div class="actions">
            <button id="exportImage" class="btn primary" type="button" data-i18n="exportImage"></button>
            <button id="exportPdf" class="btn" type="button" data-i18n="exportPdf"></button>
            <button id="shareLink" class="btn" type="button" data-i18n="shareLink"></button>
        </div>
        <div id="preview" class="preview" hidden>
            <img id="previewImage" alt="Kinklist">
            <div class="actions two">
                <button id="shareImage" class="btn primary" type="button" data-i18n="share"></button>
                <a id="downloadImage" class="btn" download="kinklist.png" data-i18n="download"></a>
            </div>
        </div>
    </dialog>

    <dialog id="editorDialog" class="sheet">
        <form method="dialog" class="sheet-header">
            <h2 data-i18n="listTitle"></h2>
            <button class="btn icon" data-i18n-aria-label="close">✕</button>
        </form>
        <p class="hint" data-i18n="listHint"></p>
        <textarea id="listText" class="input list-text" spellcheck="false"></textarea>
        <p id="editorError" class="error"></p>
        <div class="actions two">
            <button id="restoreList" class="btn" type="button" data-i18n="restoreDefault"></button>
            <button id="saveList" class="btn primary" type="button" data-i18n="save"></button>
        </div>
    </dialog>

    <div id="report" class="report"></div>

    <script src="i18n.js"></script>
    <script src="kinks.js"></script>
    <script src="export.js"></script>
    <script src="app.js"></script>
</body>
</html>
