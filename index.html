<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16161d">
    <title>Кинклист</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header id="top" class="top">
        <div class="top-row">
            <h1>Кинклист</h1>
            <span id="progress" class="progress"></span>
            <button id="openExport" class="btn primary" type="button">Экспорт</button>
        </div>
        <div id="legend" class="legend"></div>
        <nav id="categoryNav" class="category-nav"></nav>
    </header>

    <main id="list" class="list"></main>

    <footer class="bottom">
        <button id="openEditor" class="btn" type="button">Изменить список</button>
        <button id="resetRatings" class="btn danger" type="button">Сбросить ответы</button>
    </footer>

    <dialog id="exportDialog" class="sheet">
        <form method="dialog" class="sheet-header">
            <h2>Экспорт</h2>
            <button class="btn icon" aria-label="Закрыть">✕</button>
        </form>
        <label class="field-row">
            <span>Имя или ник</span>
            <input id="nameInput" class="input" type="text" maxlength="40" placeholder="Необязательно">
        </label>
        <label class="check-row">
            <input id="onlyRated" type="checkbox" checked>
            <span>Только отмеченные пункты</span>
        </label>
        <div class="actions">
            <button id="exportImage" class="btn primary" type="button">Картинка PNG</button>
            <button id="exportPdf" class="btn" type="button">PDF / печать</button>
            <button id="shareLink" class="btn" type="button">Ссылка на ответы</button>
        </div>
        <div id="preview" class="preview" hidden>
            <img id="previewImage" alt="Кинклист">
            <div class="actions two">
                <button id="shareImage" class="btn primary" type="button">Поделиться</button>
                <a id="downloadImage" class="btn" download="kinklist.png">Скачать</a>
            </div>
        </div>
    </dialog>

    <dialog id="editorDialog" class="sheet">
        <form method="dialog" class="sheet-header">
            <h2>Список</h2>
            <button class="btn icon" aria-label="Закрыть">✕</button>
        </form>
        <p class="hint"><code>#Категория</code>, затем <code>(Колонка 1, Колонка 2)</code>, затем пункты <code>* Название ::: описание</code></p>
        <textarea id="listText" class="input list-text" spellcheck="false"></textarea>
        <p id="editorError" class="error"></p>
        <div class="actions two">
            <button id="restoreList" class="btn" type="button">Стандартный</button>
            <button id="saveList" class="btn primary" type="button">Сохранить</button>
        </div>
    </dialog>

    <div id="report" class="report"></div>

    <script src="kinks.js"></script>
    <script src="export.js"></script>
    <script src="app.js"></script>
</body>
</html>
